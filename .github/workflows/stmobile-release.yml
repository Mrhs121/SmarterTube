name: Build & Publish SmarterTube Release

on:
  push:
    branches:
      - smartertube
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (defaults to version from build.gradle)'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: stmobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build stmobile APKs & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Resolve version & release metadata
        id: meta
        run: |
          VERSION_NAME=$(grep 'versionName "' smarttubetv/build.gradle | tail -n 1 | awk -F'"' '{print $2}')
          SAFE_VER="${VERSION_NAME//+/-}"

          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${SAFE_VER}-b${{ github.run_number }}"
          fi

          if [[ "$TAG_NAME" == *beta* || "$TAG_NAME" == *alpha* || "$TAG_NAME" == *-b* ]]; then
            DEFAULT_PRE=true
          else
            DEFAULT_PRE=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_PRE="${{ inputs.prerelease }}"
          else
            IS_PRE="$DEFAULT_PRE"
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Configure APK signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$SIGNING_KEY" | base64 --decode > "${{ github.workspace }}/release.jks"
            cat <<EOF > keystore.properties
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed_with=secret" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets (SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD) are not configured; generating an ephemeral release keystore so APKs remain installable."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/ephemeral-release.jks" \
              -storepass smartertube-ci \
              -alias smartertube \
              -keypass smartertube-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SmarterTube CI, OU=Mobile, O=SmarterTube, L=Unknown, S=Unknown, C=US"
            cat <<EOF > keystore.properties
          storeFile=${{ github.workspace }}/ephemeral-release.jks
          storePassword=smartertube-ci
          keyAlias=smartertube
          keyPassword=smartertube-ci
          EOF
            echo "signed_with=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Run stmobile unit tests
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:testStmobileDebugUnitTest --no-daemon

      - name: Build stmobile Release APKs
        run: ./gradlew :smarttubetv:assembleStmobileRelease --no-daemon

      - name: Verify APK outputs & generate SHA-256 checksums
        id: pkg
        run: |
          APK_DIR="smarttubetv/build/outputs/apk/stmobile/release"
          ls -lh "$APK_DIR"/*.apk
          (cd "$APK_DIR" && sha256sum *.apk > SHA256SUMS.txt)
          cat "$APK_DIR/SHA256SUMS.txt"

          {
            echo "### Build Summary"
            echo "- **Tag**: \`${{ steps.meta.outputs.tag }}\`"
            echo "- **Version**: \`${{ steps.meta.outputs.version }}\`"
            echo "- **Signing**: \`${{ env.signed_with }}\`"
            if [ "${{ env.signed_with }}" = "ephemeral" ]; then
              echo ""
              echo "> Notice: Signed with an ephemeral CI keystore. Add \`SIGNING_KEY\`, \`KEY_STORE_PASSWORD\`, \`ALIAS\`, and \`KEY_PASSWORD\` repository secrets to keep in-place upgrade signatures consistent."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmarterTube-${{ steps.meta.outputs.tag }}
          path: |
            smarttubetv/build/outputs/apk/stmobile/release/*.apk
            smarttubetv/build/outputs/apk/stmobile/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SmarterTube ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease != 'true' }}
          generate_release_notes: true
          files: |
            smarttubetv/build/outputs/apk/stmobile/release/*.apk
            smarttubetv/build/outputs/apk/stmobile/release/SHA256SUMS.txt
